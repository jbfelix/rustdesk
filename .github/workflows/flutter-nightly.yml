name: Flutter Nightly Build

on:
  workflow_dispatch:
    inputs:
      sos-incoming-only:
        description: "Client des proches (entrant seulement). Décocher pour le client opérateur."
        type: boolean
        default: true

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      sos-incoming-only: ${{ inputs.sos-incoming-only }}
