name: Flutter Nightly Build

on:
  workflow_dispatch:
    inputs:
      sos-incoming-only:
        description: "Client des proches (entrant seulement). Décocher pour le client opérateur."
        type: boolean
        default: true
      version:
        description: "Étiquette de release (ex. 1.5.0-1). « nightly » = build de test, sans mise à jour automatique."
        type: string
        default: "nightly"

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.version }}
      sos-incoming-only: ${{ inputs.sos-incoming-only }}
